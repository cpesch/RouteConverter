# PR verification for factory workspaces (Option A of rc-meta#200,
# specs/00069-factory-computational-verification.md).
#
# CANONICAL COPY lives in rc-meta at factory/verify/verify.yml.template.
# Deployed to <target repo>/.gitea/workflows/verify.yml (e.g.
# rc/RouteConverter). Keep the two in sync — edit here, then re-deploy.
#
# Runs the repo's own test suite on the `verify` runner label: a separate
# act_runner instance whose job container (verify-runner image) carries NO
# secrets — see bootstrap-server/render-act-runner-verify-config.sh. The
# code under test is agent-authored (untrusted); that is why:
#   - checkout uses persist-credentials: false (no token left in .git/config)
#   - the mvn step gets no secrets in env
#   - the workflow-level GITEA_TOKEN is only referenced in the report step
#
# Triggers:
#   - pull_request: human-pushed PRs (maintainer, manual branches)
#   - workflow_dispatch: the factory (builder/patcher) dispatches explicitly
#     after pushing with its PAT — Actions-token-adjacent pushes cannot be
#     relied on to fire events (loop guard; memory gitea-actions-token-push).
#     Input `pr` carries the PR number for the failure comment.
name: verify
on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to report the verdict on (optional)'
        required: false
        default: ''

concurrency:
  group: verify-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: verify
    timeout-minutes: 45
    steps:
      - name: checkout (no persisted credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # A compile break is the cheapest failure to detect and the most
      # expensive to mistake for a test failure: navigation-formats did not
      # compile for a day after RouteConverter #43 merged, because the breakage
      # surfaced as a red test job among other red test jobs. This gate fails in
      # seconds with only the compiler errors in its summary.
      - name: compile (fast gate)
        id: compile
        shell: bash
        run: |
          set -uo pipefail
          if [[ -x ./mvnw ]]; then MVN=./mvnw; else MVN=mvn; fi
          RC=0
          "$MVN" -B -ntp -DskipTests compile 2>&1 | tee /tmp/verify-compile.log | tail -c 200000 || RC=$?
          if [[ "$RC" -ne 0 ]]; then
            grep -E "^\[ERROR\]" /tmp/verify-compile.log | head -60 > /tmp/verify-summary.txt || true
            : > /tmp/verify-compile-failed
          fi
          exit "$RC"

      - name: run test suite
        id: mvn
        shell: bash
        run: |
          set -uo pipefail
          # mvnw when the repo carries the wrapper (pinned maven), distro
          # mvn otherwise. -DskipITs: unit tests only — integration tests
          # need network fixtures the jail doesn't provide.
          if [[ -x ./mvnw ]]; then MVN=./mvnw; else MVN=mvn; fi
          RC=0
          "$MVN" -B -ntp -DskipITs test 2>&1 | tee /tmp/verify-mvn.log | tail -c 200000 || RC=$?
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          # Failure summary for the PR comment: last reactor summary +
          # first failed-test blocks, capped hard.
          {
            grep -E "^\[ERROR\]|^\[INFO\] BUILD|Tests run:" /tmp/verify-mvn.log | tail -60
          } > /tmp/verify-summary.txt || true
          exit "$RC"

      - name: report failure on PR
        if: failure()
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # PR number: dispatch input, or the pull_request event payload.
          PR='${{ github.event.inputs.pr || github.event.pull_request.number }}'
          [[ -n "$PR" ]] || { echo "no PR number — skip comment"; exit 0; }
          SUMMARY="$(head -c 4000 /tmp/verify-summary.txt 2>/dev/null || echo 'no summary captured')"
          # A red job did not necessarily test anything. When the runner loses
          # its docker exec ("failed to inspect exec: … No such exec instance")
          # the mvn step dies without producing any output, and claiming "test
          # suite did not pass" then accuses whatever merged last of a fault it
          # does not have (seen 2026-07-30: a 134-line master log, zero Maven
          # output). Anchor the verdict on real build output, and report an
          # infra fault as inconclusive — the action there is re-dispatch, not
          # debugging the diff.
          # the compile gate runs first, so its failure leaves no mvn test log
          # at all — name it instead of calling the run inconclusive
          if [[ -e /tmp/verify-compile-failed ]]; then
            HEADLINE='🤖 **verify failed** — the sources do not compile (the test suite never ran).'
          elif grep -qE '^\[INFO\] BUILD (SUCCESS|FAILURE)|Tests run:' /tmp/verify-mvn.log 2>/dev/null; then
            HEADLINE='🤖 **verify failed** — test suite did not pass.'
          else
            HEADLINE='🤖 **verify inconclusive** — the runner produced no build output (infra fault, not your diff). Re-dispatch verify on this branch.'
            echo "::warning::verify inconclusive: no Maven output in /tmp/verify-mvn.log — runner fault, not a test failure"
          fi
          BODY="$(jq -n --arg h "$HEADLINE" --arg s "$SUMMARY" --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{body: ($h + "\n\n```\n" + $s + "\n```\n\n[Workflow run](" + $run + ")")}')"
          curl -sSf -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --data "$BODY" || echo "::warning::verify failure comment POST failed"
