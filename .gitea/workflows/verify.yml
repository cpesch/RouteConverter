# PR verification for factory workspaces.
#
# ADAPTED copy of factory/verify/verify.yml.template: same trust properties,
# plus a release-notes gate before the compile gate (rc/RouteConverter#337).
# verify-template-sha256: 0d3bf0853ef2
# ^ rc-meta scripts/check-verify-onboarding.sh compares that stamp with the
#   template's current hash. When the template changes, re-derive and re-stamp.
#
# Runs the repo's own test suite on the `verify` runner label: a separate
# act_runner instance whose job container (verify-runner image) carries NO
# secrets — see bootstrap-server/render-act-runner-verify-config.sh. The
# code under test is agent-authored (untrusted); that is why:
#   - checkout uses persist-credentials: false (no token left in .git/config)
#   - the release-notes and mvn steps get no secrets in env
#   - the workflow-level GITEA_TOKEN is only referenced in the `pr labels` step
#     and the report step; neither runs a file from the checkout, and
#     `pr labels` runs before any file from the checkout does
#
# Triggers:
#   - pull_request: human-pushed PRs (maintainer, manual branches)
#   - workflow_dispatch: the factory (builder/patcher) dispatches explicitly
#     after pushing with its PAT — Actions-token-adjacent pushes cannot be
#     relied on to fire events (loop guard; memory gitea-actions-token-push).
#     Input `pr` carries the PR number for the failure comment.
name: verify
on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to report the verdict on (optional)'
        required: false
        default: ''

concurrency:
  group: verify-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: verify
    timeout-minutes: 45
    steps:
      - name: checkout (no persisted credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # the release-notes gate diffs against origin/master
          fetch-depth: 0

      # Labels for the release-notes gate, read live from the API: a dispatch
      # run carries no PR payload, and a label added after the push has to
      # count on a re-dispatch. curl + jq only, no file from the checkout, and
      # it runs before any such file does. Any failure leaves the list empty:
      # no exemption, the gate still runs (fails closed).
      - name: pr labels
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_INPUT: ${{ github.event.inputs.pr || github.event.pull_request.number }}
        run: |
          set -uo pipefail
          OUT=/tmp/verify-pr-labels.txt
          : > "$OUT"
          PR="$PR_INPUT"
          if [[ -z "$PR" ]]; then
            echo "no PR number: no labels"; exit 0
          fi
          if [[ ! "$PR" =~ ^[0-9]+$ ]]; then
            echo "::warning::PR number is not numeric: no labels, the release-notes gate still runs"; exit 0
          fi
          if ! JSON="$(curl -sSf -H "Authorization: token $GITEA_TOKEN" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${PR}/labels")" \
             || ! jq -r '.[].name' <<<"$JSON" > "$OUT"; then
            : > "$OUT"
            echo "::warning::reading the labels of PR #${PR} failed: no exemption, the release-notes gate still runs"
          fi
          echo "PR #${PR} labels:"
          cat "$OUT"
          exit 0

      # A PR that changes shipped code (a module's src/main; translated
      # *_xx[_YY].properties excepted, the English source _en counts) must add
      # a bullet under "## Next release" in RELEASE_NOTES.md. Same rule as
      # .github/workflows/release-notes-check.yml, which never sees a PR merged
      # here: it reaches GitHub as a mirror push to master (rc/RouteConverter#337).
      # Exempt: the Crowdin branch l10n_master, the trunk patcher's
      # agent/patcher/* fixes, and PRs labelled no-user-impact. Runs before the
      # compile gate, so a missing bullet fails in seconds.
      - name: release notes (Next bullet gate)
        id: notes
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          BASE_REF: ${{ github.base_ref || 'master' }}
        run: |
          set -uo pipefail
          if [[ "$HEAD_REF" == "l10n_master" ]]; then
            echo "Exempt: Crowdin translation branch (l10n_master)."; exit 0
          fi
          if [[ "$HEAD_REF" == agent/patcher/* ]]; then
            echo "Exempt: trunk patcher branch."; exit 0
          fi
          if grep -qx 'no-user-impact' /tmp/verify-pr-labels.txt 2>/dev/null; then
            echo "Exempt: labelled no-user-impact."; exit 0
          fi

          # A git failure here is a runner/checkout fault, not a missing
          # bullet: exit without the marker, the report says inconclusive.
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD") \
            || { echo "::error::cannot diff against origin/${BASE_REF}"; exit 1; }
          # Translations don't count; the English source (_en) is UI text and does.
          shipped=$(grep -E '^[^/]+/src/main/' <<<"$changed" \
            | awk '/_en\.properties$/ || !/_[a-z][a-z](_[A-Z][A-Z])?\.properties$/' || true)
          if [[ -z "$shipped" ]]; then
            echo "No shipped code changed."; exit 0
          fi
          echo "Shipped code changed:"
          echo "$shipped"

          base=/tmp/RELEASE_NOTES.base.md
          git show "origin/${BASE_REF}:RELEASE_NOTES.md" > "$base" \
            || { echo "::error::cannot read RELEASE_NOTES.md of origin/${BASE_REF}"; exit 1; }
          if added=$(python3 .github/scripts/release_notes.py added-next "$base" RELEASE_NOTES.md); then
            echo "New Next release bullets:"
            echo "$added"
            exit 0
          fi
          # The PR comment keeps the first 4000 chars of the summary: cap the
          # file list so the instruction line always fits.
          n=$(wc -l <<<"$shipped")
          {
            head -30 <<<"$shipped"
            if [[ "$n" -gt 30 ]]; then echo "… and $((n - 30)) more"; fi
            echo
            echo 'This PR changes shipped code but adds no bullet under "## Next release" in RELEASE_NOTES.md. Add one in the matching ### New features / ### Changes / ### Fixes subsection (user-facing wording, see AGENTS.md "Release notes"), or label the PR no-user-impact and re-dispatch verify.'
          } > /tmp/verify-summary.txt
          : > /tmp/verify-notes-failed
          echo '::error::shipped code changed without a "## Next release" bullet in RELEASE_NOTES.md'
          exit 1

      # A compile break is the cheapest failure to detect and the most
      # expensive to mistake for a test failure: navigation-formats did not
      # compile for a day after RouteConverter #43 merged, because the breakage
      # surfaced as a red test job among other red test jobs. This gate fails in
      # seconds with only the compiler errors in its summary.
      - name: compile (fast gate)
        id: compile
        shell: bash
        run: |
          set -uo pipefail
          if [[ -x ./mvnw ]]; then MVN=./mvnw; else MVN=mvn; fi
          RC=0
          "$MVN" -B -ntp -DskipTests compile 2>&1 | tee /tmp/verify-compile.log || RC=$?
          if [[ "$RC" -ne 0 ]]; then
            grep -E "^\[ERROR\]" /tmp/verify-compile.log | head -60 > /tmp/verify-summary.txt || true
            : > /tmp/verify-compile-failed
          fi
          exit "$RC"

      - name: run test suite
        id: mvn
        shell: bash
        run: |
          set -uo pipefail
          # mvnw when the repo carries the wrapper (pinned maven), distro
          # mvn otherwise. -DskipITs: unit tests only — integration tests
          # need network fixtures the jail doesn't provide.
          # `tee` only, no `| tail -c`: tail prints nothing until Maven exits,
          # so a run killed mid-suite left an empty step log (rc-meta#777).
          if [[ -x ./mvnw ]]; then MVN=./mvnw; else MVN=mvn; fi
          RC=0
          "$MVN" -B -ntp -DskipITs test 2>&1 | tee /tmp/verify-mvn.log || RC=$?
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          # Failure summary for the PR comment, which keeps only its first
          # 4000 chars: failures first (failed tests, their assertion lines,
          # failed/skipped reactor modules, the verdict), passing `Tests run:`
          # lines only after them. Sorting passing lines first cut the one
          # failing test off on long suites (rc-meta#777).
          LOG=/tmp/verify-mvn.log
          {
            grep -E '<<< (FAILURE|ERROR)!' "$LOG" | head -40 || true
            grep -E '^\[ERROR\]   [^ ]+:[0-9]+' "$LOG" | head -40 || true
            grep -E '^\[(INFO|ERROR)\] .* FAILURE( \[.*\])?$' "$LOG" | head -40 || true
            grep -E '^\[(INFO|ERROR)\] .* SKIPPED$' "$LOG" | head -10 || true
            grep -E '^\[(INFO|ERROR)\] BUILD' "$LOG" || true
            grep -E '^\[ERROR\]' "$LOG" | head -40 || true
            grep -E 'Tests run:' "$LOG" | tail -60 || true
          } | awk '!seen[$0]++' > /tmp/verify-summary.txt || true
          exit "$RC"

      - name: report failure on PR
        if: failure()
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_INPUT: ${{ github.event.inputs.pr || github.event.pull_request.number }}
          MVN_RC: ${{ steps.mvn.outputs.rc }}
        run: |
          set -uo pipefail
          # PR number: dispatch input, or the pull_request event payload.
          PR="$PR_INPUT"
          [[ -n "$PR" ]] || { echo "no PR number — skip comment"; exit 0; }
          SUMMARY="$(head -c 4000 /tmp/verify-summary.txt 2>/dev/null || echo 'no summary captured')"
          # A red job did not necessarily test anything. When the runner loses
          # its docker exec ("failed to inspect exec: … No such exec instance")
          # the mvn step dies without producing any output, and claiming "test
          # suite did not pass" then accuses whatever merged last of a fault it
          # does not have (seen 2026-07-30: a 134-line master log, zero Maven
          # output). Anchor the verdict on real build output, and report an
          # infra fault as inconclusive — the action there is re-dispatch, not
          # debugging the diff.
          # the release-notes and compile gates run first, so their failure
          # leaves no mvn test log at all — name them instead of calling the
          # run inconclusive
          if [[ -e /tmp/verify-notes-failed ]]; then
            HEADLINE='🤖 **verify failed** — shipped code changed without a "## Next release" bullet in RELEASE_NOTES.md (compile and tests did not run).'
          elif [[ -e /tmp/verify-compile-failed ]]; then
            HEADLINE='🤖 **verify failed** — the sources do not compile (the test suite never ran).'
          # Maven logs a failed build at ERROR level: `[ERROR] BUILD FAILURE`.
          elif grep -qE '^\[(INFO|ERROR)\] BUILD (SUCCESS|FAILURE)' /tmp/verify-mvn.log 2>/dev/null; then
            HEADLINE='🤖 **verify failed** — test suite did not pass.'
          elif [[ -s /tmp/verify-mvn.log ]]; then
            # Maven produced output but no verdict: it was killed mid-run
            # (runner/OOM/timeout). Calling that "did not pass" sent debugging
            # to the diff; a re-run of the same commit passed (rc-meta#777).
            LAST="$(grep -E '^\[INFO\] Building ' /tmp/verify-mvn.log | tail -1 | sed -E 's/^\[INFO\] Building //' || true)"
            HEADLINE="🤖 **verify inconclusive** — Maven exited without a verdict (rc=${MVN_RC:-?}) after module ${LAST:-unknown}. Runner fault likely, not your diff: re-dispatch verify on this branch."
            echo "::warning::verify inconclusive: Maven exited without a BUILD verdict (rc=${MVN_RC:-?})"
          else
            HEADLINE='🤖 **verify inconclusive** — the runner produced no build output (infra fault, not your diff). Re-dispatch verify on this branch.'
            echo "::warning::verify inconclusive: no Maven output in /tmp/verify-mvn.log — runner fault, not a test failure"
          fi
          BODY="$(jq -n --arg h "$HEADLINE" --arg s "$SUMMARY" --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{body: ($h + "\n\n```\n" + $s + "\n```\n\n[Workflow run](" + $run + ")")}')"
          curl -sSf -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --data "$BODY" || echo "::warning::verify failure comment POST failed"
