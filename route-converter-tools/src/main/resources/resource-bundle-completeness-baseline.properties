# Baseline for slash.navigation.converter.tools.ResourceBundleCompletenessReport,
# run by .github/workflows/release-prepare.yml against
# route-converter-gui/src/main/resources/slash/navigation/converter/gui.
#
# One "locale=percent" line per locale, from the last time the report ran
# without a regression. The reporter fails a run only when a locale drops
# below ResourceBundleCompletenessReport.DEFAULT_REGRESSION_THRESHOLD (95%)
# *and* was at or above it here. A locale missing from this file (a new
# locale, or one already below the threshold, e.g. sr) never fails the run.
#
# Update this file's numbers to the reporter's fresh output whenever a
# release intentionally ships with (further) translation lag that should
# become the new floor. See Gitea issue #213.
