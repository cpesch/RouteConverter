$schema: 'https://raw.githubusercontent.com/crowdin/support/main/config-schema.json'
project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
preserve_hierarchy: true
files:
  - source: /route-converter-gui/src/main/resources/slash/navigation/converter/gui/RouteConverter_en.properties
    translation: /route-converter-gui/src/main/resources/slash/navigation/converter/gui/RouteConverter_%two_letters_code%.properties
    # keep : and = unescaped in exported .properties so downloads are
    # byte-identical to the repo files and don't churn every line
    escape_special_characters: 0
    languages_mapping:
      two_letters_code:
        pt-BR: pt_BR
        nb: nb_NO
