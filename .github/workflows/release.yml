name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-version:
    # Guards against a repeat of the 3.5 release (rc/RouteConverter#132):
    # that tag was pushed by hand, bypassing release-prepare.yml's
    # `mvn release:prepare` version bump, so pom.xml was still
    # 3.5-SNAPSHOT at build time and every jar manifest's
    # Specification-Version rendered as "3.5-SNAPSHOT-<build>" instead
    # of "3.5". Fail fast here instead of shipping another mislabeled
    # release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assert pom.xml version matches tag and is not a SNAPSHOT
        run: |
          TAG="${GITHUB_REF_NAME}"
          POM_VERSION=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' pom.xml | head -1)
          if [[ "$POM_VERSION" == *-SNAPSHOT ]]; then
            echo "::error::pom.xml version is '$POM_VERSION' (still -SNAPSHOT) for tag '$TAG'. This tag was not cut via release-prepare.yml (mvn release:prepare never bumped pom.xml). Delete the tag, bump pom.xml to a release version, and re-tag — or re-run release-prepare.yml."
            exit 1
          fi
          if [[ "$POM_VERSION" != "$TAG" ]]; then
            echo "::error::pom.xml version ('$POM_VERSION') does not match tag ('$TAG')."
            exit 1
          fi
          echo "ok: pom.xml version '$POM_VERSION' matches tag '$TAG'"

  build-linux-mac:
    needs: verify-version
    uses: ./.github/workflows/_build-linux-mac.yml
    with:
      artefact-name: release-linux-mac
      retention-days: 30
      sign: true
      signing-policy-slug: release-signing   # production cert; requires manual approval in the SignPath app during the build
    secrets: inherit

  build-windows:
    needs: verify-version
    uses: ./.github/workflows/_build-windows.yml
    with:
      artefact-name: release-windows
      retention-days: 30
      sign: true
      signing-policy-slug: release-signing   # production cert; requires manual approval in the SignPath app during the build
    secrets: inherit

  sign-mac:
    needs: build-linux-mac
    uses: ./.github/workflows/_sign-mac.yml
    with:
      unsigned-artefact: release-linux-mac
      signed-artefact:   mac-signed-release
      retention-days:    30
    secrets: inherit

  publish:
    needs: [build-linux-mac, build-windows, sign-mac]
    runs-on: ubuntu-latest
    steps:
      # Tag checkout under src/ — keeps the repo out of the artefacts/ and
      # previous-releases/ working dirs. Source of the curated release notes.
      - uses: actions/checkout@v7
        with:
          path: src
      - name: Resolve version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG}"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          path: incoming
          pattern: release-*
      - name: Flatten artefacts
        run: |
          mkdir -p artefacts
          find incoming -mindepth 2 -type f -exec mv -t artefacts/ {} +
          ls -la artefacts/
      - name: Overlay signed Mac app zips
        # mac-signed-release is outside the release-* pattern above, so it is
        # downloaded separately and copied LAST — the signed RouteConverterMac
        # and TimeAlbumProMac zips deterministically replace the unsigned ones
        # from build-linux-mac, BEFORE the *-app.zip -> *.app.zip rename below.
        uses: actions/download-artifact@v8
        with:
          name: mac-signed-release
          path: mac-signed
      - name: Apply signed Mac overlay
        run: |
          cp mac-signed/RouteConverterMac-*-app.zip mac-signed/TimeAlbumProMac-*-app.zip artefacts/
          ls -la artefacts/
      - name: Build previous-releases archive (apply *-app.zip rename)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p "previous-releases/$VERSION"
          cp artefacts/* "previous-releases/$VERSION/"
          for stem in RouteConverterMac TimeAlbumProMac; do
            for arch in x64 aarch64; do
              src="previous-releases/$VERSION/$stem-$arch-app.zip"
              dst="previous-releases/$VERSION/$stem-$arch.app.zip"
              [[ -f "$src" ]] && mv "$src" "$dst"
            done
          done
          ls -la "previous-releases/$VERSION/"
      - name: Generate sha256 checksums
        run: |
          for dir in artefacts "previous-releases/${{ steps.ver.outputs.version }}"; do
            (cd "$dir" && for f in *; do
              [[ "$f" == *.sha256 ]] && continue
              sha256sum "$f" > "$f.sha256"
            done)
          done
      # The XMLs are the PAD catalog (download portals, winget/chocolatey/
      # homebrew manifests); edit them in .github/release/, not in rc-site.
      # They ship with VERSION in release/ only — single source of the
      # released version (rc-site symlinks + update check read it). Not
      # release assets, not archived in previous-releases/.
      - name: Render catalog + VERSION
        env:
          TAG:     ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          DATE=$(git -C src log -1 --format=%cs "$TAG")          # tag commit date YYYY-MM-DD
          Y=${DATE:0:4}; M=${DATE:5:2}; D=${DATE:8:2}
          mkdir -p latest-tree
          cp artefacts/* latest-tree/
          for f in RouteConverter.xml RouteConverter_de.xml; do
            sed -E \
              -e "s|<Program_Version>[^<]+</Program_Version>|<Program_Version>${VERSION}</Program_Version>|" \
              -e "s|<Program_Release_Year>[^<]+</Program_Release_Year>|<Program_Release_Year>${Y}</Program_Release_Year>|" \
              -e "s|<Program_Release_Month>[^<]+</Program_Release_Month>|<Program_Release_Month>${M}</Program_Release_Month>|" \
              -e "s|<Program_Release_Day>[^<]+</Program_Release_Day>|<Program_Release_Day>${D}</Program_Release_Day>|" \
              "src/.github/release/$f" > "latest-tree/$f"
            grep -qF "<Program_Version>${VERSION}</Program_Version>" "latest-tree/$f"
          done
          printf '%s\n' "$VERSION" > latest-tree/VERSION
          ls -la latest-tree/
      - name: Configure SSH
        env:
          DEPLOY_KEY:  ${{ secrets.RC_RELEASE_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.RC_RELEASE_DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Rsync to static.routeconverter.com/downloads/release/
        env:
          DEPLOY_HOST: ${{ secrets.RC_RELEASE_DEPLOY_HOST }}
        run: |
          # --delete: /latest/ must only hold the current release; prunes prior-version
          # orphans (renamed/discontinued assets) that would otherwise serve stale builds
          rsync -av --delete --omit-dir-times --no-perms \
            latest-tree/ \
            "rc-release-deploy@${DEPLOY_HOST}:/var/www/routeconverter.com/static/downloads/release/"
      - name: Rsync to static.routeconverter.com/downloads/previous-releases/<v>/
        env:
          DEPLOY_HOST: ${{ secrets.RC_RELEASE_DEPLOY_HOST }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          rsync -av --omit-dir-times --no-perms \
            "previous-releases/$VERSION/" \
            "rc-release-deploy@${DEPLOY_HOST}:/var/www/routeconverter.com/static/downloads/previous-releases/$VERSION/"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
          TAG:      ${{ steps.ver.outputs.tag }}
          VERSION:  ${{ steps.ver.outputs.version }}
        run: |
          # Curated "## VERSION — DATE" section first; gh appends the generated
          # contributor notes below it. extract fails on a missing or
          # bullet-less section, before any (empty-body) release is created.
          python3 src/.github/scripts/release_notes.py --file src/RELEASE_NOTES.md \
            extract "$VERSION" --out "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" artefacts/* \
            --repo "$REPO" \
            --title "RouteConverter $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --generate-notes \
            --verify-tag

  bump-homebrew-cask:
    # Keep cpesch/homebrew-routeconverter's
    # cask in lockstep with each release. Requires HOMEBREW_TAP_TOKEN -- a
    # fine-grained PAT scoped to Contents:write on that one repo only, added
    # as a repo secret by a maintainer (no CLI path to mint that token).
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Checkout tap
        uses: actions/checkout@v7
        with:
          repository: cpesch/homebrew-routeconverter
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Fetch sha256 for both mac archs
        id: sha
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          base="https://releases.routeconverter.com/previous-releases/$VERSION"
          for arch in x64 aarch64; do
            hash=$(curl -fsSL "${base}/RouteConverterMac-${arch}.app.zip.sha256" | awk '{print $1}')
            [[ "$hash" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad sha256 for $arch: '$hash'"; exit 1; }
            echo "${arch}=$hash" >> "$GITHUB_OUTPUT"
          done
      - name: Update cask
        env:
          VERSION:      ${{ steps.ver.outputs.version }}
          SHA_X64:      ${{ steps.sha.outputs.x64 }}
          SHA_AARCH64:  ${{ steps.sha.outputs.aarch64 }}
        run: |
          set -euo pipefail
          f=Casks/routeconverter.rb
          sed -i -E "s/^(  version \").*(\")\$/\1${VERSION}\2/" "$f"
          sed -i -E "s/^(  sha256 arm:   \").*(\",)\$/\1${SHA_AARCH64}\2/" "$f"
          sed -i -E "s/^(         intel: \").*(\")\$/\1${SHA_X64}\2/" "$f"
          grep -F "$VERSION" "$f"
          grep -F "$SHA_AARCH64" "$f"
          grep -F "$SHA_X64" "$f"
      - name: Commit and push
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name "RouteConverter release bot"
          git config user.email "release@routeconverter.com"
          git commit -am "routeconverter ${VERSION}"
          git push

  publish-javadoc:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21.0.12'
      - uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: mvn javadoc:aggregate
        run: |
          ./mvnw --batch-mode -Prouteconverter -Dmaven.build.number=${{ github.run_number }} -DskipTests install
          ./mvnw --batch-mode javadoc:aggregate \
            -Dmaven.build.number=${{ github.run_number }} \
            -Dmaven.javadoc.failOnError=false \
            -Dadditionalparam=-Xdoclint:none \
            -Ddoclint=none

      - name: Configure SSH
        env:
          DEPLOY_KEY:  ${{ secrets.RC_RELEASE_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.RC_RELEASE_DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Rsync to static.routeconverter.com/javadoc/
        env:
          DEPLOY_HOST: ${{ secrets.RC_RELEASE_DEPLOY_HOST }}
        run: |
          rsync -av --delete --omit-dir-times --no-perms \
            target/reports/apidocs/ \
            "rc-release-deploy@${DEPLOY_HOST}:/var/www/routeconverter.com/static/javadoc/"
