name: Dependency Check

# OWASP dependency-check-maven (issue #212): a real CVSS gate for the ~40
# third-party jars this desktop app bundles. Weekly + manual only, NEVER on
# pull_request — the NVD feed download makes this far too slow for the PR
# path (20+ minutes on a cold cache). A red run pages nobody automatically;
# the weekly run going red on the default branch IS the signal. Do not wire
# ntfy or any other paging here.
#
# Reproduce locally: ./mvnw --batch-mode package dependency-check:aggregate -Dskip.unit.tests=true -Dskip.integration.tests=true -Djacoco.skip -Dspotbugs.skip -DfailBuildOnCVSS=7
# (honours the same config/dependency-check-suppressions.xml as this workflow).
# Use :aggregate, not :check - this is a ~30-module reactor, and :check run at
# the root without -N/-pl scans each module's own dependency subset rather than
# the single cross-module scan :aggregate performs, so the finding counts differ.

on:
  schedule:
    # Monday 03:11 UTC - a fixed early-morning slot, offset from the
    # dependency-submission.yml schedule (Monday 04:17 UTC) so the two
    # long-running jobs don't compete for runners.
    - cron: '11 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    # A warm NVD cache makes this a few minutes. A cold cache means the full
    # ~400k-record NVD download, which took 5 minutes on one day and did not
    # finish in 60 on the next (NVD API throughput varies a lot), so the cap
    # leaves room for that while still stopping a stalled download well before
    # GitHub's default 6-hour job cap.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Compute cache week
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # The NVD feed itself is multiple GB and only needs a same-week refresh
      # (NVD publishes incrementally); without this cache every run re-downloads
      # the full feed. Restore and save are separate steps on purpose: the
      # all-in-one actions/cache only saves when the whole job succeeds, and
      # this job fails exactly when it finds a vulnerability - so the cache was
      # never written and every run started from a cold download.
      - name: Restore NVD data
        id: nvd-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-data-${{ steps.week.outputs.week }}
          restore-keys: nvd-data-

      - name: Update NVD data
        id: nvd-update
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::warning::NVD_API_KEY repository secret is not set - the NVD feed download will be heavily rate-limited and this run may be much slower than usual. Add an API key at https://nvd.nist.gov/developers/request-an-api-key to speed it up."
            NVD_ARGS=()
          else
            NVD_ARGS=("-DnvdApiKey=$NVD_API_KEY")
          fi
          ./mvnw --batch-mode -N dependency-check:update-only "${NVD_ARGS[@]}"

      # saved as soon as the data is current, independent of the scan's outcome
      - name: Save NVD data
        if: always() && steps.nvd-update.outcome == 'success' && steps.nvd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-data-${{ steps.week.outputs.week }}

      - name: Run OWASP dependency-check
        run: |
          # the root module has pom packaging, so nothing creates its target/;
          # when the report location is missing, dependency-check writes the
          # report as a FILE named target instead of target/dependency-check-report.*
          # (seen on CI as "target/: Not a directory" and ENOTDIR on upload)
          mkdir -p target
          # the NVD data was refreshed by the update step above
          # package first so the reactor's own modules resolve and their
          # transitive dependencies are part of the aggregate scan; plain
          # -DskipTests is ignored by this build, so skip tests and the other
          # verify-phase gates with the project's own properties
          ./mvnw --batch-mode package dependency-check:aggregate \
            -Dskip.unit.tests=true -Dskip.integration.tests=true \
            -Djacoco.skip -Dspotbugs.skip \
            -DautoUpdate=false -DfailBuildOnCVSS=7 -Dformat=HTML,JSON

      # the first manual run failed to upload with ENOTDIR on the report path;
      # list what the plugin actually wrote so a repeat is diagnosable
      - name: List dependency-check output
        if: always()
        run: |
          ls -la target/ || true
          find . -maxdepth 3 -name 'dependency-check-report.*' -print

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: warn
