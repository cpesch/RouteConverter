name: Prerelease

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: prerelease
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-linux-mac:
    if: |
      github.event_name != 'push'
      || github.actor != 'github-actions[bot]'
      || !startsWith(github.event.head_commit.message, '[maven-release-plugin]')
    uses: ./.github/workflows/_build-linux-mac.yml
    with:
      artefact-name: prerelease-linux-mac
      retention-days: 7
      sign: false
      # Prereleases are NOT submitted to SignPath — SignPath signing is reserved
      # for real releases (release.yml, release-signing) to conserve the OSS
      # artifact-data-volume quota, which daily prerelease signing was draining.
      # Mac notarisation (sign-mac) is Apple Developer ID,
      # not SignPath, so it is unaffected and still runs below.
    secrets: inherit

  build-windows:
    if: |
      github.event_name != 'push'
      || github.actor != 'github-actions[bot]'
      || !startsWith(github.event.head_commit.message, '[maven-release-plugin]')
    uses: ./.github/workflows/_build-windows.yml
    with:
      artefact-name: prerelease-windows
      retention-days: 7
      sign: false
      # Prereleases are NOT submitted to SignPath — SignPath signing is reserved
      # for real releases (release.yml, release-signing) to conserve the OSS
      # artifact-data-volume quota, which daily prerelease signing was draining.
    secrets: inherit

  sign-mac:
    needs: build-linux-mac
    uses: ./.github/workflows/_sign-mac.yml
    with:
      unsigned-artefact: prerelease-linux-mac
      signed-artefact:   mac-signed-prerelease
      retention-days:    7
    secrets: inherit

  publish:
    needs: [build-linux-mac, build-windows, sign-mac]
    runs-on: ubuntu-latest
    steps:
      - name: Skip stale re-run
        # A nightly-triage `rerun-failed-jobs` re-run of an old Prerelease run
        # recreates the rolling release from THIS run's original SHA, which
        # would overwrite prod with an outdated build if a master push already
        # published a newer one in between. Attempt 1 always publishes.
        id: stale
        if: github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          master_sha=$(gh api "repos/${{ github.repository }}/commits/master" --jq .sha)
          if [[ "$master_sha" != "$GITHUB_SHA" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::re-run of ${GITHUB_SHA::7}: master moved to ${master_sha::7}, not publishing"
          fi
      - uses: actions/download-artifact@v8
        if: steps.stale.outputs.skip != 'true'
        with:
          path: incoming
          pattern: prerelease-*
      - name: Flatten
        if: steps.stale.outputs.skip != 'true'
        run: |
          mkdir -p artefacts
          find incoming -mindepth 2 -type f -exec mv -t artefacts/ {} +
          ls -la artefacts/
      - name: Overlay signed Mac app zips
        # mac-signed-prerelease is outside the prerelease-* pattern above, so it
        # is downloaded separately and copied LAST — the signed RouteConverterMac
        # and TimeAlbumProMac zips deterministically replace the unsigned ones
        # from build-linux-mac.
        if: steps.stale.outputs.skip != 'true'
        uses: actions/download-artifact@v8
        with:
          name: mac-signed-prerelease
          path: mac-signed
      - name: Apply signed Mac overlay
        if: steps.stale.outputs.skip != 'true'
        run: |
          cp mac-signed/RouteConverterMac-*-app.zip mac-signed/TimeAlbumProMac-*-app.zip artefacts/
          ls -la artefacts/
      - name: Configure SSH
        if: steps.stale.outputs.skip != 'true'
        env:
          DEPLOY_KEY: ${{ secrets.RC_RELEASE_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.RC_RELEASE_DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Rsync to static.routeconverter.com/downloads/prereleases/
        if: steps.stale.outputs.skip != 'true'
        env:
          DEPLOY_HOST: ${{ secrets.RC_RELEASE_DEPLOY_HOST }}
        run: |
          # --delete: /prerelease/ mirrors only the current build; prunes renamed/
          # discontinued assets so stale files aren't served (matches release.yml)
          rsync -av --delete --omit-dir-times --no-perms \
            artefacts/ \
            "rc-release-deploy@${DEPLOY_HOST}:/var/www/routeconverter.com/static/downloads/prereleases/"
      - name: Update rolling 'prerelease' GitHub Release
        if: steps.stale.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
        run: |
          tag=prerelease
          gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag || true
          gh release create "$tag" artefacts/* \
            --repo "$REPO" \
            --title "Rolling prerelease ($(date -u +%Y-%m-%d))" \
            --notes "Automated build of master @ ${GITHUB_SHA::7}." \
            --prerelease \
            --target master
