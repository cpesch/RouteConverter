name: RouteConverter CI

on: [push]

permissions:
  contents: read

# A newer push to a feature/factory branch cancels the older run on the same
# ref; only the head SHA needs a status. master and 3.* (release/maintenance)
# keep every run: they get a per-run group, because a shared group would still
# let GitHub drop a *pending* run when a third push arrives, cancel-in-progress
# or not.
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/3.')) && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 21, 25 ]
    name: Java ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Show Maven version
        run: mvn --version
      - name: Build with Maven
        run: mvn --batch-mode -Dmaven.build.number=${{ github.run_number }} --update-snapshots verify
      # Upload coverage once per build (Java 21 only — avoid duplicate uploads from the matrix)
      - name: Upload coverage to Codecov
        if: matrix.java == 21
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  prerelease:
    runs-on: windows-latest
    strategy:
      matrix:
        java: [ 21 ]
    name: Java ${{ matrix.java }} on Windows
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Show Maven version
        run: mvn --version
      - name: Build with Maven
        # Quote the -D: pwsh (default windows-latest shell) tokenizes
        # `.build.number` as member-access, splitting the arg into
        # `-Dmaven` + `.build.number=NNN` → mvn sees the latter as a
        # lifecycle phase and dies.
        # -Djacoco.skip: Codecov only uploads from Linux Java 21, so the
        # Windows coverage agent only slows the tests down.
        run: mvn --batch-mode "-Dmaven.build.number=${{ github.run_number }}" "-Djacoco.skip=true" --update-snapshots verify
      - uses: actions/upload-artifact@v7
        with:
          name: RouteConverter Windows Prerelease built with Java ${{ matrix.java }}
          # The needs-Java launch4j .exe is gone (specs/00044); this PR-smoke
          # build runs `mvn verify` (no NSIS), so upload the shaded launcher jar.
          path: RouteConverterWindows/target/RouteConverterWindows.jar
          overwrite: true
