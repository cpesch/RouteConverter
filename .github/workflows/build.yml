name: RouteConverter CI

# Feature/factory branches run only Java 21 on Linux (the required check).
# Java 25 and Windows run on master and 3.* pushes, nightly, on manual
# dispatch (to check a branch on Windows before merging it), and on any push
# whose head commit message contains `[full-ci]` (fix PRs for nightly
# failures, spec 00078). The `scope` job decides this once.
on:
  push:
  schedule:
    - cron: '0 2 * * *'   # an hour before prerelease.yml
  workflow_dispatch:

permissions:
  contents: read

# C1-only JIT for every JVM (Maven, test forks, SpotBugs): these JVMs are short
# and CPU-starved, so C2 compile work costs more than it saves. Benchmarked
# 2026-10-11: SpotBugs 242 -> 108 s, Windows 231 -> 124 s.
env:
  JAVA_TOOL_OPTIONS: -XX:TieredStopAtLevel=1

# A newer push to a feature/factory branch cancels the older run on the same
# ref; only the head SHA needs a status. master and 3.* (release/maintenance)
# keep every run: they get a per-run group, because a shared group would still
# let GitHub drop a *pending* run when a third push arrives, cancel-in-progress
# or not. The event name keeps a manual or nightly run apart from push runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/3.')) && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - id: scope
        env:
          FULL: ${{ github.event_name != 'push' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/3.') || contains(github.event.head_commit.message, '[full-ci]') }}
        run: echo "full=$FULL" >> "$GITHUB_OUTPUT"

  build:
    needs: scope
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ${{ fromJSON(needs.scope.outputs.full == 'true' && '[21, 25]' || '[21]') }}
    name: Java ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Show Maven version
        run: mvn --version
      - name: Build with Maven
        # -T 1C: parallel modules. Linux only; on Windows it was 13-18 % slower.
        # SpotBugs runs once, in the spotbugs job; no test reads a shaded jar.
        # forkCount=1: one test JVM per module. With -T 1C, the pom's 1.5C
        # started 116 test JVMs on 4 cores (279 -> 78 s with C1).
        run: mvn --batch-mode -T 1C -Dsurefire.forkCount=1 -Dmaven.build.number=${{ github.run_number }} -Dspotbugs.skip=true -Dshade.skip=true --update-snapshots verify
      # nightly-triage.yml reads the reports of a failed job from the artifact
      # `surefire-<job name, spaces -> '-'>`. Keep every Maven step named
      # `... with Maven`: the triage classifies a failure in any other step as
      # infra.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-Java-${{ matrix.java }}
          path: '**/target/surefire-reports/TEST-*.xml'
          retention-days: 7
      # Upload coverage once per build (Java 21 only — avoid duplicate uploads from the matrix)
      - name: Upload coverage to Codecov
        if: matrix.java == 21
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # SpotBugs once (~40 % of a serial build), next to the test jobs instead of
  # inside each of them. Tests are compiled (test-jars feed other modules) but
  # not run.
  spotbugs:
    runs-on: ubuntu-latest
    name: SpotBugs
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: SpotBugs with Maven
        run: mvn --batch-mode -T 1C -Dskip.unit.tests=true -Dskip.integration.tests=true -Djacoco.skip=true -Dshade.skip=true --update-snapshots verify

  prerelease:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: windows-latest
    # Fixed name, no matrix: a skipped matrix job reports its check under the
    # unexpanded name, which never matches the required check.
    name: Java 21 on Windows
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Show Maven version
        run: mvn --version
      - name: Build with Maven
        # Quote the -D: pwsh (default windows-latest shell) tokenizes
        # `.build.number` as member-access, splitting the arg into
        # `-Dmaven` + `.build.number=NNN` → mvn sees the latter as a
        # lifecycle phase and dies.
        # -Djacoco.skip: Codecov only uploads from Linux Java 21, so the
        # Windows coverage agent only slows the tests down.
        # SpotBugs runs in the spotbugs job; no test reads a shaded jar.
        run: mvn --batch-mode "-Dmaven.build.number=${{ github.run_number }}" "-Djacoco.skip=true" "-Dspotbugs.skip=true" "-Dshade.skip=true" "-Dsurefire.forkCount=1" --update-snapshots verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-Java-21-on-Windows
          path: '**/target/surefire-reports/TEST-*.xml'
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Nightly-only checks (spec 00078 Phase 3). Scheduled runs only: they cover
  # what a push run never sees, and nightly-triage.yml files their failures.
  # Every Maven step is named `... with Maven`: the triage classifies a
  # failure in any other step as infra. A failing test job uploads its reports
  # as `surefire-<job name, spaces -> '-'>`.
  # ---------------------------------------------------------------------------

  # The ITs that need no network and no credentials (pom profile
  # hermetic-integration-test excludes the live-service ones). Unit tests are
  # skipped: the build job ran them. navigation-formats' ITs read the private
  # samples checkout, which CI doesn't have (38 of its 46 IT classes error
  # without it), so failsafe.ci.excludes drops that module's IT packages.
  hermetic-its:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    name: Hermetic ITs
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Integration tests with Maven
        run: mvn --batch-mode -T 1C -Phermetic-integration-test "-Dfailsafe.ci.excludes=%regex[.*slash/navigation/(babel|base|bcr|columbus|csv|excel|gopal|gpx|itn|kml|lmx|nmn|ovl|photo|simple|tour|url|wbt|zip)/[^/]*IT\.class]" -Dsurefire.forkCount=1 -Djacoco.skip=true -Dspotbugs.skip=true -Dshade.skip=true --update-snapshots verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-Hermetic-ITs
          path: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          retention-days: 7

  # The build as a developer runs it: pom defaults (forkCount 1.5C), C2 JIT,
  # shading and SpotBugs inline. Catches tests that depend on order or shared
  # state, which forkCount=1 hides, and breakage only the full build shows.
  local-parity:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    name: Local parity
    env:
      JAVA_TOOL_OPTIONS: ''
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build with Maven
        run: mvn --batch-mode -Dmaven.build.number=${{ github.run_number }} --update-snapshots verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-Local-parity
          path: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          retention-days: 7

  # Unit tests in random order; the seed is the run id, so a red night
  # reproduces with -Dsurefire.runOrder.random.seed=<run id>.
  random-order:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    name: Random test order
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build with Maven
        run: mvn --batch-mode -T 1C -Dsurefire.forkCount=1 -Dsurefire.runOrder=random -Dsurefire.runOrder.random.seed=${{ github.run_id }} -Djacoco.skip=true -Dspotbugs.skip=true -Dshade.skip=true --update-snapshots verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-Random-test-order
          path: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          retention-days: 7

  # The release packaging (shading included) that the CI test jobs skip, with
  # dummy values for the secrets release.yml passes in.
  package:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    name: Package
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Package with Maven
        run: mvn --batch-mode -Prouteconverter -Dmaven.build.number=${{ github.run_number }} -DcrashReportSecret=nightly-dummy -DtimeAlbumGoogleMapsApiKey=nightly-dummy -DskipTests -Dspotbugs.skip=true --update-snapshots package

  # Environment snapshot for the drift comparison (nightly_drift.py): artifact
  # `drift-snapshot` with `drift.json`, a flat string -> string object.
  # java.<job name> is the JDK setup-java resolves tonight for that job
  # (same distribution), image.* the runner image, snapshot.<group:artifact>
  # every resolved third-party SNAPSHOT dependency.
  drift-snapshot:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    name: Drift snapshot
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21 and 25
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: |
            25
            21
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Resolve dependencies with Maven
        run: mvn --batch-mode -T 1C -Dskip.unit.tests=true -Dskip.integration.tests=true -Djacoco.skip=true -Dspotbugs.skip=true -Dshade.skip=true --update-snapshots compile dependency:list -DoutputFile=target/deps.txt -DexcludeGroupIds=slash.navigation
      - name: Write drift.json
        run: |
          set -euo pipefail
          jv() { "$1/bin/java" -XshowSettings:properties -version 2>&1 | sed -n 's/^ *java.runtime.version = //p'; }
          JAVA_21="$(jv "$JAVA_HOME_21_X64")" JAVA_25="$(jv "$JAVA_HOME_25_X64")" python3 - <<'EOF'
          import glob, json, os, re
          snap = {}
          for path in glob.glob("**/target/deps.txt", recursive=True):
              for line in open(path, encoding="utf-8"):
                  m = re.match(r"\s*([^:\s]+):([^:]+):[^:]+:(?:[^:]+:)?([^:]*SNAPSHOT[^:]*):", line)
                  if m:
                      snap[f"snapshot.{m.group(1)}:{m.group(2)}"] = m.group(3)
          data = {
              "java.Java 21": os.environ["JAVA_21"],
              "java.Java 25": os.environ["JAVA_25"],
              "image.os": os.environ.get("ImageOS", ""),
              "image.version": os.environ.get("ImageVersion", ""),
              **snap,
          }
          json.dump(data, open("drift.json", "w"), indent=2, sort_keys=True)
          print(json.dumps(data, indent=2, sort_keys=True))
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: drift-snapshot
          path: drift.json
          retention-days: 14
