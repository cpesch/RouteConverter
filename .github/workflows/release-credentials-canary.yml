name: Release credentials canary

# #488 (3.7 release retro): runs the release-prepare credential probes plus the
# fine-grained-PAT expiry check (_release-credentials.yml) every week, so a
# broken or soon-expiring release credential pages ntfy before release day.
# On 3.7 the SignPath GitHub App had silently lost access months earlier and
# HOMEBREW_TAP_TOKEN lacked write; nothing noticed between releases.
# SignPath itself stays unprobed (see the comment in _release-credentials.yml).
#
# Run by hand: gh workflow run release-credentials-canary.yml --repo cpesch/RouteConverter
on:
  schedule:
    - cron: '23 4 * * 1'   # Mondays 04:23 UTC, clear of dependency-check.yml's Monday 03:11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    uses: ./.github/workflows/_release-credentials.yml
    secrets: inherit

  alert:
    needs: probe
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: ntfy on failure
        # Same idiom as verify-cut.yml: the ntfy server denies anonymous posts,
        # the topic is factory-rc, and a lost alert never fails the job.
        env:
          NTFY_PUBLISHER_TOKEN: ${{ secrets.NTFY_PUBLISHER_TOKEN }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $NTFY_PUBLISHER_TOKEN" -H "Title: release credentials canary failed" \
            -d "A release credential is broken or expires within 30 days — see GitHub Actions run ${{ github.run_id }}" \
            https://ntfy.routeconverter.com/factory-rc || echo "::warning::ntfy post failed"
