name: Release prepare

# Manually-triggered workflow that replaces the maintainer's local
# `mvn release:prepare` + `git push --follow-tags` ritual.
#
# What it does:
#   0. Probe every release credential (job `credentials`, dry AND real
#      runs) so a broken token fails here, not after the tag is pushed.
#   1. Validate inputs (regex on release_version + development_version)
#      and fail unless RELEASE_NOTES.md "## Next release" has bullets.
#   2. Stamp "## Next release" as "## <version> — <date>" and commit, then
#      mvn release:prepare → tags the release + bumps master to the next
#      development version + auto-pushes both commits and the tag.
#      Push uses RC_RELEASE_PUSH_TOKEN (a fine-grained PAT), NOT the
#      workflow-issued GITHUB_TOKEN — the latter does not trigger
#      downstream workflows, so the tag push would leave release.yml
#      silently un-fired. Afterwards open a fresh empty
#      "## Next release" section on master.
#   3. cuts and pushes a <version>-maintenance branch.
#   4. Clones rc-site via Gitea PAT, bumps catalog XMLs, commits, pushes.
#      (Previously fired a Gitea repository_dispatch into a separate
#      rc-site/.gitea/workflows/catalog-bump.yml — collapsed into this
#      workflow per Phase 5.8 plan-review O2 on 2026-06-07.)
#
# Tag push from step 2 fires release.yml automatically.

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version, plain (e.g. 3.5). No `v` prefix.'
        required: true
      development_version:
        description: 'Next development version (e.g. 3.6-SNAPSHOT). Must end -SNAPSHOT.'
        required: true
      dry_run:
        description: 'Dry-run only (no commits, no tag, no push, no catalog bump)'
        type: boolean
        default: false

permissions:
  contents: write

# Two rapid invocations would otherwise collide on a pom that has
# already advanced to the next-dev version. Queue them; never cancel.
concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  # Credential probes — read-only / dry-run, run for dry AND real runs so the
  # dry run exercises every credential the real run (and release.yml) uses.
  # On 3.7 the dry run was green, then the real run hit broken credentials
  # only after the tag was pushed.
  #   - RC_RELEASE_PUSH_TOKEN: git push --dry-run to master
  #   - HOMEBREW_TAP_TOKEN: git push --dry-run of an empty commit to a
  #     non-existent branch (authenticates receive-pack, writes nothing;
  #     ls-remote would only prove read access)
  #   - RC_RELEASE_DEPLOY_SSH_KEY + RC_RELEASE_DEPLOY_HOST: rsync -n of an
  #     empty dir into static/downloads/release/ (no --delete)
  # Not probed: SignPath — no read-only probe of the SignPath GitHub App
  # installation exists for a workflow token; its "Failed to retrieve GitHub
  # App token" only surfaces at submit time.
  credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          token: ${{ secrets.RC_RELEASE_PUSH_TOKEN }}

      - name: "Probe RC_RELEASE_PUSH_TOKEN"
        run: |
          set -euo pipefail
          git push --dry-run origin HEAD:refs/heads/master || {
            echo "::error::RC_RELEASE_PUSH_TOKEN cannot push to cpesch/RouteConverter (needs contents:write) — release:prepare would fail to push the tag"
            exit 1
          }

      - name: "Probe HOMEBREW_TAP_TOKEN"
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          d=$(mktemp -d) && cd "$d" && git init -q
          git -c user.name=probe -c user.email=probe@routeconverter.com commit -q --allow-empty -m probe
          git push --dry-run "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/cpesch/homebrew-routeconverter.git" HEAD:refs/heads/credential-probe || {
            echo "::error::HOMEBREW_TAP_TOKEN cannot push to cpesch/homebrew-routeconverter (fine-grained PAT needs Contents: Read and write on that repo)"
            exit 1
          }

      - name: Configure SSH
        env:
          DEPLOY_KEY:  ${{ secrets.RC_RELEASE_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.RC_RELEASE_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: "Probe RC_RELEASE_DEPLOY_SSH_KEY + RC_RELEASE_DEPLOY_HOST"
        env:
          DEPLOY_HOST: ${{ secrets.RC_RELEASE_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          rsync -an --omit-dir-times --no-perms "$(mktemp -d)/" \
            "rc-release-deploy@${DEPLOY_HOST}:/var/www/routeconverter.com/static/downloads/release/" || {
            echo "::error::release deploy SSH/rsync to static/downloads/release/ failed — check RC_RELEASE_DEPLOY_SSH_KEY / RC_RELEASE_DEPLOY_HOST"
            exit 1
          }

  prepare:
    needs: credentials
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        run: |
          rv='${{ inputs.release_version }}'
          dv='${{ inputs.development_version }}'
          [[ "$rv" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || {
            echo "::error::release_version must be MAJOR.MINOR[.PATCH], no v prefix. Got: $rv"
            exit 1
          }
          [[ "$dv" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?-SNAPSHOT$ ]] || {
            echo "::error::development_version must end in -SNAPSHOT. Got: $dv"
            exit 1
          }
          echo "ok: release=$rv  development=$dv"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # release-plugin needs full history + tags
          # RC_RELEASE_PUSH_TOKEN: fine-grained PAT scoped
          # `contents:write` on cpesch/RouteConverter only. Required
          # because pushes made under GITHUB_TOKEN do NOT trigger
          # downstream workflows — release.yml would silently skip
          # the tag push.
          token: ${{ secrets.RC_RELEASE_PUSH_TOKEN }}

      - name: "RELEASE_NOTES: Next release is curated"
        # Runs in dry AND real runs, so an un-curated cut fails before any
        # build work. Placed after checkout (not literally after "Validate
        # inputs", which runs before the tree exists).
        run: python3 .github/scripts/release_notes.py check-next

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'

      - uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: git identity (commits authored by the workflow bot)
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: translation completeness report (Gitea issue #213)
        # Informational-by-design placement: this runs in release-prepare,
        # never in the PR build, because translation lag is not a reason to
        # block a merge — but shipping a release with a fresh, untranslated
        # dialog (e.g. the feature-lock dialog, #213) should be a conscious
        # act. Fails only when a locale that was previously at or above
        # ResourceBundleCompletenessReport.DEFAULT_REGRESSION_THRESHOLD
        # (95%) has since dropped below it; a first sighting or a locale
        # already below that floor (sr, ~79%, pre-existing) never fails
        # the run. Update the baseline file's numbers when a release
        # intentionally ships with (further) translation lag that should
        # become the new floor.
        run: |
          ./mvnw --batch-mode -pl route-converter-tools -am package \
            -Djacoco.skip=true -Dskip.unit.tests=true -Dskip.integration.tests=true
          java -cp route-converter-tools/target/classes \
            slash.navigation.converter.tools.ResourceBundleCompletenessReport \
            route-converter-gui/src/main/resources/slash/navigation/converter/gui \
            RouteConverter en \
            route-converter-tools/src/main/resources/resource-bundle-completeness-baseline.properties

      - name: rewrite SSH github URLs to HTTPS
        # pom <developerConnection> is scm:git:git@github.com:... (SSH).
        # release-plugin pushes via developerConnection, but the runner
        # has no SSH key — only the token-backed HTTPS extraheader from
        # actions/checkout. Rewrite SSH→HTTPS so the push reuses that
        # token. Without this the push dies: "git@github.com: Permission
        # denied (publickey)". pom stays SSH for the maintainer's local
        # release:prepare fallback.
        run: git config url.'https://github.com/'.insteadOf 'git@github.com:'

      - name: "RELEASE_NOTES: stamp ${{ inputs.release_version }}"
        # Committed before release:prepare so the tag's tree carries the
        # stamped notes; the plugin pushes this commit along with its own.
        # Skipped on dry runs — the plugin's dry run needs a clean tree.
        if: inputs.dry_run != true
        run: |
          python3 .github/scripts/release_notes.py stamp "${{ inputs.release_version }}" "$(TZ=Europe/Berlin date +%F)"
          git add RELEASE_NOTES.md
          git commit -m "docs(release-notes): stamp ${{ inputs.release_version }}"

      - name: mvn release:prepare
        # -Darguments passes flags to the forked Maven invocation that
        # release:prepare spawns for `clean verify`. Skip jacoco's
        # coverage check (separate concern from cutting a release) and
        # the slow integration tests (release workflow doesn't gate on
        # them — `build.yml` already runs the full matrix on every push).
        run: |
          DRY=""
          if [[ '${{ inputs.dry_run }}' == 'true' ]]; then DRY='-DdryRun=true'; fi
          ./mvnw --batch-mode release:prepare $DRY \
            -DautoVersionSubmodules=true \
            -Dresume=false \
            -DreleaseVersion='${{ inputs.release_version }}' \
            -DdevelopmentVersion='${{ inputs.development_version }}' \
            -Dtag='${{ inputs.release_version }}' \
            -Darguments='-Djacoco.skip=true -DskipITs'

      - name: "RELEASE_NOTES: open Next release"
        # master only — the maintenance branch is cut from the tag below.
        if: inputs.dry_run != true
        run: |
          python3 .github/scripts/release_notes.py open-next
          # open-next is idempotent; skip the commit on a re-run that finds
          # the section already open.
          if git diff --quiet RELEASE_NOTES.md; then exit 0; fi
          git add RELEASE_NOTES.md
          git commit -m "docs(release-notes): open Next release after ${{ inputs.release_version }}"
          git push origin HEAD:master

      - name: cut <version>-maintenance branch
        if: inputs.dry_run != true
        run: |
          BR='${{ inputs.release_version }}-maintenance'
          git checkout -b "$BR" '${{ inputs.release_version }}'
          git push -u origin "$BR"

      - name: clean up release-plugin leftovers
        if: always()
        run: |
          find . -name '*.releaseBackup' -delete
          rm -f release.properties

      - name: Bump catalog XMLs on rc-site
        if: inputs.dry_run != true
        env:
          GITEA_TOKEN: ${{ secrets.RC_SITE_DISPATCH_TOKEN }}
          GITEA_HOST:  ${{ secrets.RC_SITE_GITEA_HOST }}
          VERSION:     ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          git clone --depth 1 \
            "https://x-access-token:${GITEA_TOKEN}@${GITEA_HOST}/rc/rc-site.git" .
          git config user.name  'github-actions[bot]'
          git config user.email 'release-prepare@routeconverter.com'
          today_year=$(date +%Y)
          today_month=$(date +%m)
          today_day=$(date +%d)
          for f in static/downloads/RouteConverter.xml static/downloads/RouteConverter_de.xml; do
            sed -i -E \
              -e "s|<Program_Version>[^<]+</Program_Version>|<Program_Version>${VERSION}</Program_Version>|" \
              -e "s|<Program_Release_Year>[^<]+</Program_Release_Year>|<Program_Release_Year>${today_year}</Program_Release_Year>|" \
              -e "s|<Program_Release_Month>[^<]+</Program_Release_Month>|<Program_Release_Month>${today_month}</Program_Release_Month>|" \
              -e "s|<Program_Release_Day>[^<]+</Program_Release_Day>|<Program_Release_Day>${today_day}</Program_Release_Day>|" \
              "$f"
          done
          if git diff --quiet; then
            echo "rc-site catalog XMLs already at ${VERSION} — no bump needed"
            exit 0
          fi
          git add static/downloads/RouteConverter.xml static/downloads/RouteConverter_de.xml
          git commit -m "downloads: bump catalog XMLs to ${VERSION} ($(date -I))"
          # The Gitea host (strato) intermittently hits a PID/TasksMax cap;
          # its pre-receive hook then dies with
          #   runtime/cgo: pthread_create failed: Resource temporarily unavailable
          # → SIGABRT → "pre-receive hook declined". That's transient host
          # exhaustion, not a bad push — retry with backoff before failing
          # the release.
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              echo "catalog push ok (attempt ${attempt})"
              exit 0
            fi
            echo "::warning::catalog push failed (attempt ${attempt}/5) — strato may be PID-capped; retrying"
            sleep $(( attempt * 15 ))
          done
          echo "::error::catalog push still failing after 5 attempts — check the catalog host's PID/TasksMax cap"
          exit 1
